<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M.E.O.W. charts</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f3f4f6);
    --ink: var(--tg-theme-text-color, #16181d);
    --quiet: var(--tg-theme-hint-color, #6b7280);
    --accent: var(--tg-theme-button-color, #3b6fd8);
    --accent-ink: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--quiet) 25%, transparent);
    --good: #2fa57d; --bad: #d0453a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-radius: 10px; padding: 3px; }
  .seg button { padding: 7px 0; border-radius: 8px; font-weight: 600; color: var(--quiet); }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .nav { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 2px; }
  .nav button { width: 40px; height: 40px; border-radius: 20px; font-size: 22px; color: var(--accent); }
  .nav button:disabled { color: var(--line); cursor: default; }
  .nav h1 { margin: 0; font-size: 20px; text-align: center; }
  .sub { text-align: center; color: var(--quiet); font-size: 13px; min-height: 18px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
  .tile { background: var(--card); border-radius: 12px; padding: 10px 12px; }
  .tile .k { color: var(--quiet); font-size: 12px; }
  .tile .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .d { font-size: 12px; color: var(--quiet); }
  .good { color: var(--good) !important; } .bad { color: var(--bad) !important; }
  section { margin-top: 22px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--quiet); margin: 0 0 8px; font-weight: 600; }
  .donut { display: block; width: 240px; height: 240px; margin: 4px auto 8px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; color: var(--quiet); font-size: 14px; }
  .switch { width: 44px; height: 26px; border-radius: 13px; background: var(--line); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 10px;
    background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch[aria-checked="true"] { background: var(--accent); } .switch[aria-checked="true"]::after { left: 21px; }
  .row { display: grid; grid-template-columns: 14px 1fr auto 42px; gap: 10px; align-items: center; width: 100%;
    padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; }
  .sw { width: 14px; height: 14px; border-radius: 4px; }
  .amt { font-variant-numeric: tabular-nums; text-align: right; }
  .pct { color: var(--quiet); text-align: right; font-variant-numeric: tabular-nums; }
  .chg { font-size: 12px; color: var(--quiet); }
  .entries { padding: 2px 0 8px 24px; border-bottom: 1px solid var(--line); }
  .entry { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 0; font-size: 14px; }
  .entry small { display: block; color: var(--quiet); font-size: 12px; }
  .entry .amt small { text-align: right; }
  .bar { height: 8px; border-radius: 4px; background: var(--card); position: relative; margin: 6px 0 2px; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--good); }
  .bar i.warn { background: #d9a21f; } .bar i.over { background: var(--bad); }
  .budget { padding: 8px 0; } .budget .top { display: flex; justify-content: space-between; font-size: 14px; }
  .budget .top span:last-child { color: var(--quiet); font-variant-numeric: tabular-nums; }
  ul.plain { list-style: none; padding: 0; margin: 0; } ul.plain li { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .empty, .msg { color: var(--quiet); text-align: center; padding: 28px 8px; }
  .loading main > *:not(.seg):not(.nav):not(.sub) { opacity: .45; transition: opacity .2s; }
</style>
</head>
<body>
<main>
  <div class="seg" role="group" aria-label="Period">
    <button id="tab-week" aria-pressed="false">Week</button>
    <button id="tab-month" aria-pressed="false">Month</button>
  </div>
  <div class="nav">
    <button id="prev" aria-label="Previous">‹</button>
    <h1 id="label">…</h1>
    <button id="next" aria-label="Next">›</button>
  </div>
  <div class="sub" id="sub"></div>
  <div id="body"><div class="msg">Loading…</div></div>
</main>
<script>
(() => {
  // Everyday categories take the palette in the order of the everyday pie, so a category keeps its colour
  // when bills are switched on; bills get slate tones of their own. Same palette as the picture in the chat.
  const PALETTE = ["#3B6FD8", "#E07B4C", "#2FA57D", "#8C5FC7", "#D9A21F", "#D05B85"], OTHER = "#9AA0A8";
  const BILLS = ["#475569", "#64748B", "#94A3B8", "#334155"];
  const tg = window.Telegram && window.Telegram.WebApp;
  const q = new URLSearchParams(location.search);
  const state = { kind: q.get("kind") === "week" ? "week" : "month", start: q.get("start") || null, bills: false,
                  open: null, data: null };
  try { state.bills = localStorage.getItem("meow-bills") === "1"; } catch (e) {}
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[c]);
  let colours = {};
  const colour = (i, name) => name === "Other" ? OTHER : (colours[name] || PALETTE[i % PALETTE.length]);
  function assignColours(d) {
    colours = {};
    d.pie.forEach((s, i) => { if (s.name !== "Other") colours[s.name] = PALETTE[i % PALETTE.length]; });
    d.categories.filter(c => c.bill).sort((a, b) => b.amount - a.amount)
      .forEach((c, i) => { colours[c.name] = BILLS[i % BILLS.length]; });
  }
  const day = iso => new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  const haptic = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };

  if (tg) { tg.ready(); tg.expand(); }

  async function load() {
    if (!tg || !tg.initData) {
      $("body").innerHTML = '<div class="msg">Open this page from the 📊 See charts button in the M.E.O.W. chat.</div>';
      return;
    }
    document.body.classList.add("loading");
    try {
      const res = await fetch(location.pathname + location.search, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": tg.initData },
        body: JSON.stringify({ kind: state.kind, start: state.start }),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || "Something went wrong.");
      state.data = body; state.start = body.start; state.open = null; assignColours(body);
      render();
    } catch (e) {
      $("body").innerHTML = `<div class="msg">${esc(e.message || "Couldn't load your numbers.")}<br><br>
        <button id="retry" style="color:var(--accent)">Try again</button></div>`;
      $("retry").onclick = load;
    } finally {
      document.body.classList.remove("loading");
    }
  }

  function donut(slices, centre, caption) {
    const total = slices.reduce((s, x) => s + x.amount, 0), R = 110, r = 70, c = 120;
    const pt = (a, rad) => `${c + rad * Math.sin(a)} ${c - rad * Math.cos(a)}`;
    let acc = 0, paths = "";
    if (!total) {
      paths = `<circle cx="${c}" cy="${c}" r="${(R + r) / 2}" fill="none" stroke="var(--card)" stroke-width="${R - r}"/>`;
    } else if (slices.length === 1) {
      paths = `<circle cx="${c}" cy="${c}" r="${(R + r) / 2}" fill="none" stroke="${colour(0, slices[0].name)}" stroke-width="${R - r}"/>`;
    } else {
      slices.forEach((s, i) => {
        const gap = 0.012, a0 = acc / total * 2 * Math.PI + gap; acc += s.amount;
        const a1 = acc / total * 2 * Math.PI - gap, big = a1 - a0 > Math.PI ? 1 : 0;
        if (a1 <= a0) return;
        paths += `<path data-i="${i}" d="M${pt(a0, R)}A${R} ${R} 0 ${big} 1 ${pt(a1, R)}L${pt(a1, r)}A${r} ${r} 0 ${big} 0 ${pt(a0, r)}Z"
          fill="${colour(i, s.name)}"><title>${esc(s.name)}: ${esc(s.amount_text)} (${s.share}%)</title></path>`;
      });
    }
    return `<svg class="donut" viewBox="0 0 240 240" role="img" aria-label="Spending by category">${paths}
      <text x="120" y="118" text-anchor="middle" font-size="22" font-weight="650" fill="var(--ink)">${esc(centre)}</text>
      <text x="120" y="140" text-anchor="middle" font-size="12" fill="var(--quiet)">${esc(caption)}</text></svg>`;
  }

  function entriesFor(names, type) {
    const set = new Set(names);
    const rows = state.data.entries.filter(e => e.type === type && set.has(e.category));
    if (!rows.length) return '<div class="entries"><div class="entry"><span class="chg">No entries</span></div></div>';
    return '<div class="entries">' + rows.map(e => `<div class="entry"><span>${esc(e.description || e.category)}
      <small>${esc(day(e.day))}${e.wallet ? " · " + esc(e.wallet) : ""}${names.length > 1 ? " · " + esc(e.category) : ""}</small></span>
      <span class="amt">${esc(e.amount_text)}${e.original_text ? `<small>${esc(e.original_text)}</small>` : ""}</span></div>`).join("") + "</div>";
  }

  function render() {
    const d = state.data;
    $("label").textContent = d.label;
    $("tab-week").setAttribute("aria-pressed", d.kind === "week");
    $("tab-month").setAttribute("aria-pressed", d.kind === "month");
    $("prev").disabled = !d.previous_start; $("next").disabled = !d.next_start;
    $("sub").textContent = d.current ? `so far · ${d.days} of ${d.days_total} days · logged on ${d.days_logged}`
                                     : `logged on ${d.days_logged} of ${d.days_total} days`;

    const ch = d.change_pct;
    const change = ch == null ? `no spending ${esc(d.compared_with)}`
      : `<span class="${ch > 0 ? "bad" : "good"}">${ch > 0 ? "+" : "−"}${Math.abs(ch)}%</span> vs ${esc(d.compared_with)}`;
    let tiles = `<div class="tile"><div class="k">Spent</div><div class="v">${esc(d.spent_text)}</div><div class="d">${change}</div></div>
      <div class="tile"><div class="k">Income</div><div class="v">${esc(d.income_text)}</div><div class="d">Net <span class="${d.net >= 0 ? "good" : "bad"}">${esc(d.net_text)}</span></div></div>`;
    if (d.kind === "month") {
      const sr = d.savings_rate;
      tiles += `<div class="tile"><div class="k">Savings rate</div><div class="v ${sr == null ? "" : sr > 0 ? "good" : "bad"}">${sr == null ? "–" : sr + "%"}</div>
        <div class="d">${sr == null ? "no income yet" : "of income kept"}</div></div>
        <div class="tile"><div class="k">Bills</div><div class="v">${esc(d.bills_text)}</div><div class="d">${esc(d.bills_note)}</div></div>`;
    }

    const slices = state.bills ? d.pie_with_bills : d.pie;
    const centre = state.bills ? d.spent_text : d.everyday_text;
    let html = `<div class="tiles">${tiles}</div>`;
    html += `<section><h2>Where it went</h2>`;
    if (!slices.length) {
      html += `<div class="empty">Nothing spent${d.current ? " yet" : ""}.</div>`;
    } else {
      html += donut(slices, centre, state.bills ? "spent" : (d.bills ? "everyday spending" : "spent"));
      if (d.bills) html += `<div class="toggle"><span>Include bills (${esc(d.bills_text)})</span>
        <button class="switch" id="bills" role="switch" aria-checked="${state.bills}" aria-label="Include bills"></button></div>`;
      const prevBy = Object.fromEntries(d.categories.map(c => [c.name, c.previous]));
      slices.forEach((s, i) => {
        const before = s.members.length === 1 ? prevBy[s.members[0]] : 0;
        const diff = before ? Math.round((s.amount - before) * 100 / before) : null;
        const trend = diff != null && Math.abs(diff) >= 10 ? ` <span class="chg">${diff > 0 ? "▲" : "▼"}${Math.abs(diff)}%</span>` : "";
        html += `<button class="row" data-slice="${i}" aria-expanded="${state.open === i}">
          <span class="sw" style="background:${colour(i, s.name)}"></span>
          <span>${esc(s.name)}${trend}</span><span class="amt">${esc(s.amount_text)}</span><span class="pct">${s.share}%</span></button>`;
        if (state.open === i) html += entriesFor(s.members, "expense");
      });
    }
    html += `</section>`;

    if (d.income_categories.length) {
      html += `<section><h2>Income</h2>`;
      d.income_categories.forEach((c, i) => {
        const key = "inc" + i;
        html += `<button class="row" data-income="${i}" aria-expanded="${state.open === key}"><span class="sw" style="background:var(--good)"></span>
          <span>${esc(c.name)}</span><span class="amt">${esc(c.amount_text)}</span><span class="pct"></span></button>`;
        if (state.open === key) html += entriesFor([c.name], "income");
      });
      html += `</section>`;
    }

    if (d.budgets.length) {
      html += `<section><h2>Budgets</h2>` + d.budgets.map(b => `<div class="budget"><div class="top"><span>${esc(b.name)}</span>
        <span>${esc(b.spent_text)} / ${esc(b.limit_text)} · ${b.pct}%</span></div>
        <div class="bar"><i class="${b.pct >= 100 ? "over" : b.pct >= 80 ? "warn" : ""}" style="width:${Math.min(b.pct, 100)}%"></i></div></div>`).join("") + `</section>`;
    }
    if (d.top.length) {
      html += `<section><h2>Biggest</h2><ul class="plain">` + d.top.map(t =>
        `<li class="entry"><span>${esc(t.description)}<small>${esc(day(t.day))}</small></span><span class="amt">${esc(t.amount_text)}</span></li>`).join("") + `</ul></section>`;
    }
    if ((d.facts && d.facts.length) || d.tip) {
      html += `<section><h2>Fun facts</h2><ul class="plain">` + (d.facts || []).map(f => `<li>${esc(f)}</li>`).join("")
        + (d.tip ? `<li><b>${esc(d.tip)}</b></li>` : "") + `</ul></section>`;
    }
    if (d.patterns.length) {
      html += `<section><h2>Patterns</h2><ul class="plain">` + d.patterns.map(p => `<li>${esc(p)}</li>`).join("") + `</ul></section>`;
    }
    if (d.unconverted) html += `<p class="chg">⏳ ${d.unconverted} entries had no exchange rate yet and aren't in the totals.</p>`;
    $("body").innerHTML = html;

    $("body").querySelectorAll("[data-slice]").forEach(b => b.onclick = () => {
      const i = Number(b.dataset.slice); state.open = state.open === i ? null : i; haptic(); render();
    });
    $("body").querySelectorAll("[data-income]").forEach(b => b.onclick = () => {
      const k = "inc" + b.dataset.income; state.open = state.open === k ? null : k; haptic(); render();
    });
    const sw = $("bills");
    if (sw) sw.onclick = () => {
      state.bills = !state.bills; state.open = null; haptic();
      try { localStorage.setItem("meow-bills", state.bills ? "1" : "0"); } catch (e) {}
      render();
    };
  }

  $("tab-week").onclick = () => { if (state.kind !== "week") { state.kind = "week"; haptic(); load(); } };
  $("tab-month").onclick = () => { if (state.kind !== "month") { state.kind = "month"; haptic(); load(); } };
  $("prev").onclick = () => { if (state.data && state.data.previous_start) { state.start = state.data.previous_start; haptic(); load(); } };
  $("next").onclick = () => { if (state.data && state.data.next_start) { state.start = state.data.next_start; haptic(); load(); } };
  load();
})();
</script>
</body>
</html>
