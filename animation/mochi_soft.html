<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}svg{display:block}</style></head>
<body>
<svg id="stage" width="540" height="540" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf2ea"/><stop offset="1" stop-color="#f4e6d9"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd5bd"/><stop offset="1" stop-color="#ddbe9f"/></linearGradient>
  <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#fbf6f2"/><stop offset="1" stop-color="#efe3dc"/></linearGradient>
  <radialGradient id="furHead" cx="0.42" cy="0.35" r="0.7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3e9e3"/></radialGradient>
  <linearGradient id="furFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e7e1"/><stop offset="1" stop-color="#e4d6ce"/></linearGradient>
  <filter id="fluff" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur2"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs>

<!-- cosy room, softly out of focus -->
<rect width="480" height="480" fill="url(#wall)"/>
<g filter="url(#blur2)" opacity="0.75">
  <rect x="306" y="56" width="132" height="112" rx="12" fill="#fffaf4" stroke="#ead6c3" stroke-width="7"/>
  <line x1="372" y1="56" x2="372" y2="168" stroke="#ead6c3" stroke-width="5"/>
  <rect x="26" y="64" width="96" height="262" rx="8" fill="#e9d0b7"/>
  <rect x="38" y="84" width="12" height="54" rx="3" fill="#bccadb"/><rect x="53" y="90" width="11" height="48" rx="3" fill="#dfb6ab"/>
  <rect x="67" y="82" width="13" height="56" rx="3" fill="#c9d5b8"/><rect x="83" y="88" width="11" height="50" rx="3" fill="#ead69f"/>
  <rect x="38" y="164" width="12" height="52" rx="3" fill="#dfb6ab"/><rect x="53" y="156" width="14" height="60" rx="3" fill="#bccadb"/>
  <rect x="70" y="162" width="11" height="54" rx="3" fill="#c9d5b8"/>
  <rect x="26" y="138" width="96" height="6" fill="#dcbea0"/><rect x="26" y="216" width="96" height="6" fill="#dcbea0"/>
  <path d="M380,330 v-70 q0,-26 26,-26 h50 v96 z" fill="#efe1d2"/>
</g>
<rect y="332" width="480" height="148" fill="url(#floor)"/>
<g opacity="0.9"><ellipse cx="250" cy="400" rx="170" ry="30" fill="#efdcd6"/>
  <ellipse cx="250" cy="400" rx="140" ry="22" fill="none" stroke="#e4c8c2" stroke-width="5"/>
  <ellipse cx="250" cy="400" rx="105" ry="15" fill="none" stroke="#e4c8c2" stroke-width="4"/></g>

<ellipse id="shadow" cx="250" cy="396" rx="92" ry="12" fill="#8a6a58" opacity="0.18" filter="url(#blur6)"/>

<g id="cat" filter="url(#fluff)">
  <!-- far legs (behind the body) -->
  <g id="legFF"><rect x="-13" y="-20" width="26" height="76" rx="13" fill="url(#furFar)" stroke="#9b8590" stroke-width="2.6"/></g>
  <g id="legFB"><rect x="-13" y="-20" width="26" height="76" rx="13" fill="url(#furFar)" stroke="#9b8590" stroke-width="2.6"/></g>
  <!-- tail -->
  <path id="tailO" fill="none" stroke="#9b8590" stroke-width="27" stroke-linecap="round"/>
  <path id="tailI" fill="none" stroke="#fdf9f6" stroke-width="21" stroke-linecap="round"/>
  <!-- near legs -->
  <g id="legNB"><rect x="-14" y="-20" width="28" height="76" rx="14" fill="url(#fur)" stroke="#9b8590" stroke-width="2.8"/>
    <path d="M-6,50 v5 M1,50 v5 M8,50 v5" stroke="#b7a2ab" stroke-width="1.8" stroke-linecap="round"/></g>
  <g id="legNF"><rect x="-14" y="-20" width="28" height="76" rx="14" fill="url(#fur)" stroke="#9b8590" stroke-width="2.8"/>
    <path d="M-6,50 v5 M1,50 v5 M8,50 v5" stroke="#b7a2ab" stroke-width="1.8" stroke-linecap="round"/></g>
  <!-- body -->
  <path d="M-88,0 C-90,-50 -46,-60 0,-58 C50,-56 92,-48 92,-4 C92,38 50,52 0,52 C-48,52 -86,44 -88,0 Z"
        fill="url(#fur)" stroke="#9b8590" stroke-width="3"/>
  <path d="M-74,26 q22,14 46,6" fill="none" stroke="#e2d4cd" stroke-width="3" stroke-linecap="round"/>
  <path d="M70,-8 q8,10 2,22 q8,4 4,14" fill="none" stroke="#e7dbd5" stroke-width="3" stroke-linecap="round"/>

  <!-- head, side view -->
  <g id="head">
    <g id="headSide">
      <path d="M-14,-30 L-24,-80 Q-24,-88 -16,-84 L18,-46 Z" fill="url(#furFar)" stroke="#9b8590" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M2,-36 L8,-86 Q10,-94 16,-88 L40,-42 Z" fill="url(#furHead)" stroke="#9b8590" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M8,-46 L12,-76 L30,-46 Z" fill="#f6c3bb"/>
      <ellipse cx="0" cy="0" rx="48" ry="43" fill="url(#furHead)" stroke="#9b8590" stroke-width="3"/>
      <ellipse cx="40" cy="12" rx="13" ry="10" fill="#fffdfb" stroke="#9b8590" stroke-width="2.2"/>
      <path d="M49,6 q5,2 4,6 q-4,1 -6,-2 z" fill="#f2a6a3"/>
      <path d="M44,18 q-4,6 -10,3" fill="none" stroke="#7d6872" stroke-width="2.2" stroke-linecap="round"/>
      <g id="eyeS" transform="translate(22,-2)"><ellipse rx="7.5" ry="10" fill="#33282f"/><circle cx="2.5" cy="-4" r="3" fill="#fff"/><circle cx="-2" cy="3.5" r="1.3" fill="#fff" opacity=".8"/></g>
      <ellipse cx="16" cy="16" rx="11" ry="6.5" fill="#f7b5b5" opacity="0.5"/>
      <path d="M50,14 l14,-3 M50,18 l15,1" stroke="#c9b6bd" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <!-- head, turned to you -->
    <g id="headFront" opacity="0">
      <path d="M-30,-26 L-38,-80 Q-38,-88 -30,-84 L4,-44 Z" fill="url(#furHead)" stroke="#9b8590" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M-28,-40 L-33,-74 L-8,-44 Z" fill="#f6c3bb"/>
      <path d="M30,-26 L38,-80 Q38,-88 30,-84 L-4,-44 Z" fill="url(#furHead)" stroke="#9b8590" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M28,-40 L33,-74 L8,-44 Z" fill="#f6c3bb"/>
      <ellipse cx="0" cy="0" rx="50" ry="43" fill="url(#furHead)" stroke="#9b8590" stroke-width="3"/>
      <g id="eyeFL" transform="translate(-17,-2)"><ellipse rx="8" ry="10.5" fill="#33282f"/><circle cx="2.6" cy="-4" r="3.1" fill="#fff"/><circle cx="-2" cy="3.5" r="1.3" fill="#fff" opacity=".8"/></g>
      <g id="eyeFR" transform="translate(17,-2)"><ellipse rx="8" ry="10.5" fill="#33282f"/><circle cx="2.6" cy="-4" r="3.1" fill="#fff"/><circle cx="-2" cy="3.5" r="1.3" fill="#fff" opacity=".8"/></g>
      <path d="M-4,12 h8 l-4,4 z" fill="#f2a6a3"/>
      <path d="M0,16 q-4,7 -9,3 M0,16 q4,7 9,3" fill="none" stroke="#7d6872" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="-30" cy="14" rx="11" ry="6.5" fill="#f7b5b5" opacity="0.5"/>
      <ellipse cx="30" cy="14" rx="11" ry="6.5" fill="#f7b5b5" opacity="0.5"/>
    </g>
  </g>
</g>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const ease = x => (1 - Math.cos(Math.PI * clamp(x))) / 2;
const set = (id, tf) => $(id).setAttribute('transform', tf);

function legs(phase, amp, lift) {
  // diagonal gait: near-front with far-back, far-front with near-back
  const a = Math.sin(phase) * amp, b = -a;
  const up = s => lift * Math.max(0, s);  // the swinging leg lifts a little
  set('legNF', `translate(54,36) translate(0,${-up(Math.cos(phase))}) rotate(${a})`);
  set('legFB', `translate(-58,32) translate(0,${-up(Math.cos(phase))}) rotate(${a})`);
  set('legFF', `translate(40,32) translate(0,${-up(-Math.cos(phase))}) rotate(${b})`);
  set('legNB', `translate(-50,36) translate(0,${-up(-Math.cos(phase))}) rotate(${b})`);
}

function tail(t, sway, curl) {
  // a soft S-shaped tail whose tip sways
  const s = Math.sin(t * 3.2) * sway, s2 = Math.sin(t * 3.2 - 0.9) * sway;
  const d = `M-80,-10 C-112,-12 ${-128 + s*0.4},${-40 - curl} ${-116 + s},${-78 - curl} ` +
            `S${-86 + s2*1.4},${-112 - curl} ${-92 + s2*1.6},${-96 - curl}`;
  $('tailO').setAttribute('d', d); $('tailI').setAttribute('d', d);
}

// Neutral: side-walk in, stop, look at you, wave the tail, blink.
function neutral(t) {
  const walkEnd = 2.8, turn = 3.2;
  const p = ease(t / walkEnd);
  const x = -110 + (250 + 110) * p;                  // from off-screen left to the middle
  const speed = clamp(1 - Math.max(0, t - (walkEnd - 0.5)) / 0.5); // slows to a stop
  const phase = t * 2 * Math.PI * 1.5;
  const amp = 24 * speed;
  const bob = Math.abs(Math.sin(phase)) * 4 * speed;
  const breathe = t > walkEnd ? Math.sin((t - walkEnd) * 2.4) * 1.2 : 0;
  set('cat', `translate(${x},${302 - bob}) scale(1,${1 + breathe * 0.006})`);
  $('shadow').setAttribute('cx', x);
  legs(phase, amp, 7 * speed);
  // head bobs while walking; once stopped it turns to face you
  const look = ease((t - walkEnd) / (turn - walkEnd));
  const tilt = t > turn ? Math.sin((t - turn) * 1.8) * 5 : Math.sin(phase * 2) * 1.5 * speed;
  set('head', `translate(${80 - look * 6},${-50 + bob * 0.3}) rotate(${tilt})`);
  $('headSide').setAttribute('opacity', 1 - look);
  $('headFront').setAttribute('opacity', look);
  // the tail sways gently while walking, waves happily once stopped
  tail(t, t > walkEnd ? 14 : 6, t > walkEnd ? 6 * look : 0);
  // blink once she's looking at you
  const b = t > 4.3 && t < 4.5 ? 1 - Math.sin((t - 4.3) / 0.2 * Math.PI) : 1;
  ['eyeFL', 'eyeFR'].forEach((id, i) =>
    set(id, `translate(${i ? 17 : -17},-2) scale(1,${Math.max(0.08, b)})`));
  set('eyeS', `translate(22,-2) scale(1,${t % 1.9 > 1.82 ? 0.15 : 1})`);
}
window.draw = (scene, t) => ({neutral})[scene](t);
draw('neutral', 4.0);
</script>
</body></html>
