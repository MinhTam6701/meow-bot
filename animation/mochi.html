<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff}svg{display:block}</style></head>
<body>
<svg id="stage" width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8efe6"/><stop offset="1" stop-color="#f3e4d6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9cfb5"/><stop offset="1" stop-color="#dcbb9b"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6eee8"/>
    </radialGradient>
  </defs>

  <!-- room -->
  <rect width="480" height="480" fill="url(#wall)"/>
  <g opacity="0.55">
    <rect x="300" y="60" width="130" height="110" rx="10" fill="#fdf8f2" stroke="#e6d2bf" stroke-width="6"/>
    <line x1="365" y1="60" x2="365" y2="170" stroke="#e6d2bf" stroke-width="5"/>
    <rect x="30" y="70" width="90" height="250" rx="6" fill="#e7cdb3"/>
    <g>
      <rect x="40" y="88" width="12" height="52" rx="2" fill="#b9c7d6"/><rect x="55" y="94" width="10" height="46" rx="2" fill="#d9b2a8"/>
      <rect x="68" y="86" width="13" height="54" rx="2" fill="#c6d2b4"/><rect x="84" y="92" width="10" height="48" rx="2" fill="#e8d39a"/>
      <rect x="40" y="168" width="11" height="50" rx="2" fill="#d9b2a8"/><rect x="54" y="160" width="14" height="58" rx="2" fill="#b9c7d6"/>
      <rect x="71" y="166" width="10" height="52" rx="2" fill="#c6d2b4"/>
      <line x1="30" y1="142" x2="120" y2="142" stroke="#d6b899" stroke-width="5"/>
      <line x1="30" y1="220" x2="120" y2="220" stroke="#d6b899" stroke-width="5"/>
    </g>
  </g>
  <rect y="330" width="480" height="150" fill="url(#floor)"/>
  <ellipse cx="240" cy="392" rx="150" ry="26" fill="#ead6cf" opacity="0.8"/>

  <!-- Mochi -->
  <ellipse id="shadow" cx="240" cy="392" rx="78" ry="11" fill="#7a5c4a" opacity="0.16"/>
  <g id="cat">
    <g id="tailPivot" transform="translate(296,372)">
      <g id="tail">
        <path d="M0,0 C38,-4 64,-34 54,-76 C49,-98 30,-104 24,-88" fill="none" stroke="#5d4b5e" stroke-width="30" stroke-linecap="round"/>
        <path d="M0,0 C38,-4 64,-34 54,-76 C49,-98 30,-104 24,-88" fill="none" stroke="#fffaf6" stroke-width="22" stroke-linecap="round"/>
      </g>
    </g>
    <g id="hindL"><ellipse cx="196" cy="384" rx="30" ry="14" fill="url(#fur)" stroke="#5d4b5e" stroke-width="4"/></g>
    <g id="hindR"><ellipse cx="284" cy="384" rx="30" ry="14" fill="url(#fur)" stroke="#5d4b5e" stroke-width="4"/></g>
    <g id="body">
      <path id="bodyPath" d="M240,236 C300,236 318,300 314,346 C311,378 286,392 240,392 C194,392 169,378 166,346 C162,300 180,236 240,236 Z"
            fill="url(#fur)" stroke="#5d4b5e" stroke-width="4.5"/>
      <path d="M222,262 q8,10 18,4 q10,6 18,-4" fill="none" stroke="#e8dcd6" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="legL"><rect x="207" y="318" width="26" height="74" rx="13" fill="url(#fur)" stroke="#5d4b5e" stroke-width="4"/>
      <path d="M214,386 v6 M220,386 v6 M226,386 v6" stroke="#5d4b5e" stroke-width="2" stroke-linecap="round"/></g>
    <g id="legR"><rect x="247" y="318" width="26" height="74" rx="13" fill="url(#fur)" stroke="#5d4b5e" stroke-width="4"/>
      <path d="M254,386 v6 M260,386 v6 M266,386 v6" stroke="#5d4b5e" stroke-width="2" stroke-linecap="round"/></g>
    <g id="head">
      <g id="earL">
        <path d="M186,184 L172,118 Q170,108 180,112 L226,150 Z" fill="url(#fur)" stroke="#5d4b5e" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M190,170 L181,128 L214,154 Z" fill="#f4bdb4"/>
      </g>
      <g id="earR">
        <path d="M294,184 L308,118 Q310,108 300,112 L254,150 Z" fill="url(#fur)" stroke="#5d4b5e" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M290,170 L299,128 L266,154 Z" fill="#f4bdb4"/>
      </g>
      <path d="M240,146 C292,146 322,172 322,212 C322,250 290,268 240,268 C190,268 158,250 158,212 C158,172 188,146 240,146 Z"
            fill="url(#fur)" stroke="#5d4b5e" stroke-width="4.5"/>
      <ellipse cx="196" cy="230" rx="15" ry="9" fill="#f7b9b9" opacity="0.55"/>
      <ellipse cx="284" cy="230" rx="15" ry="9" fill="#f7b9b9" opacity="0.55"/>
      <g id="eyes">
        <g id="eyeL" transform="translate(212,209)"><ellipse rx="10" ry="12.5" fill="#2e2530"/><circle cx="3.5" cy="-4.5" r="3.6" fill="#fff"/><circle cx="-3" cy="4" r="1.6" fill="#fff" opacity=".8"/></g>
        <g id="eyeR" transform="translate(268,209)"><ellipse rx="10" ry="12.5" fill="#2e2530"/><circle cx="3.5" cy="-4.5" r="3.6" fill="#fff"/><circle cx="-3" cy="4" r="1.6" fill="#fff" opacity=".8"/></g>
      </g>
      <path d="M235,226 h10 l-5,5 z" fill="#f2a2a0" stroke="#e48d8b" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M240,231 q-5,8 -11,4 M240,231 q5,8 11,4" fill="none" stroke="#5d4b5e" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
<script>
const $ = id => document.getElementById(id);
const ease = x => x<0?0:x>1?1:(1-Math.cos(Math.PI*x))/2;
const set = (id, tf) => $(id).setAttribute('transform', tf);

// Neutral: walk in (0-1.8s), sit (1.8-2.2s), then wave the tail and blink (2.2-4.4s)
function neutral(t){
  const walkEnd = 1.8, sitEnd = 2.2;
  const p = ease(Math.min(t / walkEnd, 1));
  const x = -300 * (1 - p);                         // comes in from the left
  const walking = t < walkEnd;
  const step = walking ? Math.sin(t * 2 * Math.PI * 2.6) : 0;
  const bob = walking ? Math.abs(step) * 6 : 0;
  // sitting settles: a small squash
  const s = t >= walkEnd && t < sitEnd ? Math.sin((t - walkEnd) / (sitEnd - walkEnd) * Math.PI) : 0;
  set('cat', `translate(${x},${-bob + s*4}) translate(240,392) scale(${1 + s*0.03},${1 - s*0.04}) translate(-240,-392)`);
  $('shadow').setAttribute('cx', 240 + x);
  // legs step while walking
  set('legL', `translate(0,${walking ? Math.max(0, step) * -10 : 0})`);
  set('legR', `translate(0,${walking ? Math.max(0, -step) * -10 : 0})`);
  set('hindL', `translate(0,${walking ? Math.max(0, -step) * -6 : 0})`);
  set('hindR', `translate(0,${walking ? Math.max(0, step) * -6 : 0})`);
  // head: gentle tilt once seated, little nod while walking
  const tilt = t > sitEnd ? Math.sin((t - sitEnd) * 2.2) * 4 : step * 1.5;
  set('head', `rotate(${tilt} 240 250)`);
  // tail: waves gently while walking, happily once seated
  const tailAmp = t > sitEnd ? 16 : 6;
  set('tailPivot', `translate(296,372) rotate(${Math.sin(t * (t > sitEnd ? 5 : 8)) * tailAmp})`);
  // ears twitch once
  const twitch = t > 3.3 && t < 3.5 ? Math.sin((t - 3.3) / 0.2 * Math.PI) * 10 : 0;
  set('earR', `rotate(${twitch} 280 160)`);
  // blink at 2.8s
  const b = t > 2.75 && t < 2.95 ? 1 - Math.sin((t - 2.75) / 0.2 * Math.PI) : 1;
  set('eyeL', `translate(212,209) scale(1,${Math.max(0.08, b)})`);
  set('eyeR', `translate(268,209) scale(1,${Math.max(0.08, b)})`);
}
window.draw = (scene, t) => ({neutral})[scene](t);
draw('neutral', 3.0);
</script>
</body></html>
